<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Study Notes Generator</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="container">

    <h1>📚 AI Study Notes Generator</h1>

    <p class="intro">
        ⭐ Welcome to the AI Study Notes Generator!
        Enter any topic and generate concise,
        exam-friendly study notes using AI.
    </p>

    <div class="input-section">

        <input
            type="text"
            placeholder="Enter a topic e.g. Computer Networks"
        >

        <button>
            Generate Notes
        </button>

    </div>

    <h2>👨‍🎓 Generated Notes</h2>

    <div class="notes-actions">

    <button id="copyBtn">
        📋 Copy Notes
    </button>

    <button id="downloadBtn">
        📄 Download Notes
    </button>

</div>

<div id="notesoutput">
    <p>Your notes will appear here...</p>
</div>
</div>

<script src="/script.js"></script>

</body>

</html>
